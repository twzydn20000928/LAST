name: core-tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[test]'
      - run: pytest -q
      - name: Rebuild audited partial robustness tables
        run: |
          python -m last.robustness_table --reports \
            results/hunyuan_i2v_primary20.json \
            results/hunyuan_t2v_primary13.json \
            results/wan22_i2v_primary13.json \
            results/wan22_t2v_primary12.json \
            results/wan22_i2v_videoshield_first1_partial.json \
            results/hunyuan_i2v_videoshield_first2_complete.json \
            results/hunyuan_i2v_sigmark_first1_partial.json \
            results/hunyuan_t2v_videomark_first40.json \
            --output .ci-tables/robustness
          for report in hunyuan_i2v_primary20 hunyuan_t2v_primary13 wan22_i2v_primary13 wan22_t2v_primary12; do
            python tools/paired_primary_intervals.py --report "results/${report}.json" \
              --output ".ci-tables/robustness/${report}-intervals.json"
          done
          python tools/matched_component_table.py --table4 \
            --archived-reread results/hunyuan_i2v_archived_reader_pair.json \
            > .ci-tables/robustness/table4-component-ablation.md
          python tools/hunyuan_prefix_recovery.py --additional-original results/hunyuan_i2v_message_178_180.json \
            --verify-original-slice results/hunyuan_i2v_last_primary100_179.json \
            --message-tables results/replayed_message_counts_eight.json \
            > .ci-tables/robustness/hunyuan-i2v-last-first180.md
          python tools/fidelity_intervals.py results/hunyuan_i2v_primary_fidelity_180.json \
            > .ci-tables/robustness/hunyuan-i2v-last-first180-fidelity.json
          python tools/plot_margin_sweep.py --cells results/margin_sweep_cells.json \
            --output .ci-tables/robustness/margin-sweep --tables-only
          python tools/development_margin_recovery.py --cells results/development_margin_seven_videos.json \
            > .ci-tables/robustness/development-margin-sensitivity.json
          python - <<'PY'
          import csv
          from pathlib import Path
          rebuilt = Path(".ci-tables/robustness/margin-sweep")
          archived = Path("results")
          assert (rebuilt / "table5.md").read_text() == (archived / "margin_sweep_table5.md").read_text()
          def counts(path):
              with path.open(newline="") as stream:
                  return list(csv.DictReader(stream))
          assert counts(rebuilt / "margin-sweep.csv") == counts(archived / "margin_sweep_aggregate.csv")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: audited-partial-robustness-tables
          path: .ci-tables/robustness/
          if-no-files-found: error
      - name: Rebuild Table 1 with available quality dimensions
        run: |
          mkdir -p ci-clean-tables/quality
          for arm in last reference; do
            python tools/quality_units_table.py results/hunyuan_i2v_quality_units/*_"${arm}".json \
              > "ci-clean-tables/quality/hunyuan_i2v_${arm}.json"
          done
          for units in results/camera_motion/*_camera_units.json results/hunyuan_t2v_videomark_camera_units.json; do
            sample=$(basename "$units" _camera_units.json)
            python tools/quality_units_table.py "$units" > "ci-clean-tables/quality/${sample}.json"
          done
          python -m last.clean_table --family hunyuan \
            --reports results/hunyuan_{i2v_primary20,t2v_primary13}.json \
              results/hunyuan_i2v_videoshield_first2_complete.json results/hunyuan_t2v_videomark_first40.json \
              results/hunyuan_i2v_sigmark_first1_partial.json \
            --quality ci-clean-tables/quality/hunyuan_*.json --output ci-clean-tables/hunyuan.md
          python -m last.clean_table --family wan22 \
            --reports results/wan22_i2v_primary13.json results/wan22_t2v_primary12.json results/wan22_i2v_videoshield_first1_partial.json \
            --quality ci-clean-tables/quality/wan22_*.json \
            --output ci-clean-tables/wan22.md
      - uses: actions/upload-artifact@v4
        with:
          name: audited-partial-clean-tables
          path: ci-clean-tables/
          if-no-files-found: error
      - name: Rebuild supplementary temporal diagnostics
        run: |
          mkdir ci-temporal-diagnostics
          python tools/controlled_reader_table.py results/hunyuan_i2v_last_controlled_paper*.json \
            --primary results/hunyuan_i2v_last_first100_robustness.json \
            --primary results/hunyuan_i2v_last_primary100_179.json \
            > ci-temporal-diagnostics/table12-shared-fusion.md
          python tools/summarize_assisted_subsets.py results/assisted_group_equal_counts_first43.json \
            > ci-temporal-diagnostics/table12-equal-group-counts.json
          receipts=(results/hunyuan_i2v_oracle_paper*.json)
          python tools/paired_oracle_table.py --report results/hunyuan_i2v_last_first100_robustness.json \
            --report results/hunyuan_i2v_last_primary100_179.json --manifest configs/primary_manifest.json \
            --oracle-dir results --count "${#receipts[@]}" > ci-temporal-diagnostics/table12-oracle.md
          python tools/pool_clean_consistency.py results/hunyuan_i2v_clean_consistency_paper{003,032,033,043,063,071,098,112,146,149,160,174}.json \
            > ci-temporal-diagnostics/table13-clean-consistency.json
          python tools/stress_recovery_table.py --reports results/stress_paper*_forty_maps.json \
            --primary results/hunyuan_i2v_last_first100_robustness.json \
            --primary results/hunyuan_i2v_last_primary100_179.json --alignment > ci-temporal-diagnostics/table15.json
          python tools/stress_recovery_table.py --reports results/stress_paper*_forty_maps.json \
            --format markdown > ci-temporal-diagnostics/table15-recovery.md
          python tools/stress_deletion_alignment.py --reports results/stress_paper*_forty_maps.json \
            > ci-temporal-diagnostics/table15-deletion.json
      - uses: actions/upload-artifact@v4
        with:
          name: audited-partial-temporal-diagnostics
          path: ci-temporal-diagnostics/
          if-no-files-found: error
  video-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[video,test]'
      - run: pip check
      - run: pytest -q
  native-baseline-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[video,baselines]'
      - run: pip check
      - run: python -m last.upstream --directory .ci-upstream --download
      - name: Native initial-noise interfaces (not video robustness)
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          for method in videoshield videomark sigmark; do
            python -m last.baseline_probe --method "$method" --upstream .ci-upstream --output "ci-native-probes/$method"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          for method in ('videoshield', 'videomark', 'sigmark'):
              result = json.loads((Path('ci-native-probes') / method / 'receipt.json').read_text())
              assert result['status'] == 'completed' and result['correct_bits'] == 512, result
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-interface-receipts
          path: ci-native-probes/*/receipt.json
          if-no-files-found: error
