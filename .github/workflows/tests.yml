name: core-tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[test]'
      - run: pytest -q
      - name: Rebuild audited partial robustness tables
        run: |
          python -m last.robustness_table --reports \
            results/hunyuan_i2v_primary17.json \
            results/hunyuan_t2v_primary11.json \
            results/wan22_i2v_primary11.json \
            results/wan22_t2v_primary10.json \
            results/hunyuan_i2v_videoshield_first1.json \
            results/hunyuan_t2v_videomark_first38.json \
            --output .ci-tables/robustness
          for report in hunyuan_i2v_primary17 hunyuan_t2v_primary11 wan22_i2v_primary11 wan22_t2v_primary10; do
            python tools/paired_primary_intervals.py --report "results/${report}.json" \
              --output ".ci-tables/robustness/${report}-intervals.json"
          done
          python tools/matched_component_table.py --table4 \
            --archived-reread results/hunyuan_i2v_archived_reader_pair.json \
            > .ci-tables/robustness/table4-component-ablation.md
          python tools/hunyuan_prefix_recovery.py --additional-original results/hunyuan_i2v_message_178_179.json \
            --verify-original-slice results/hunyuan_i2v_last_primary100_178.json \
            --message-tables results/replayed_message_counts_eight.json \
            > .ci-tables/robustness/hunyuan-i2v-last-first179.md
      - uses: actions/upload-artifact@v4
        with:
          name: audited-partial-robustness-tables
          path: .ci-tables/robustness/
          if-no-files-found: error
      - name: Rebuild Table 1 with available quality dimensions
        run: |
          python -m last.clean_table --family hunyuan \
            --reports results/hunyuan_{i2v_primary17,t2v_primary11}.json \
              results/hunyuan_i2v_videoshield_first1.json results/hunyuan_t2v_videomark_first38.json \
            --quality results/hunyuan_i2v_quality_five_dimensions_{last,reference}.json \
              results/camera_motion/hunyuan_t2v_{last,reference}_camera_quality.json \
              results/hunyuan_t2v_videomark_quality.json --output ci-clean-tables/hunyuan.md
          python -m last.clean_table --family wan22 \
            --reports results/wan22_i2v_primary11.json results/wan22_t2v_primary10.json \
            --quality results/camera_motion/wan22_{i2v,t2v}_{last,reference}_camera_quality.json \
            --output ci-clean-tables/wan22.md
      - uses: actions/upload-artifact@v4
        with:
          name: audited-partial-clean-tables
          path: ci-clean-tables/*.md
          if-no-files-found: error
      - name: Rebuild supplementary temporal diagnostics
        run: |
          mkdir ci-temporal-diagnostics
          python tools/controlled_reader_table.py results/hunyuan_i2v_last_controlled_paper005.json \
            > ci-temporal-diagnostics/table12-shared-fusion.md
          receipts=(results/hunyuan_i2v_oracle_paper*.json)
          python tools/paired_oracle_table.py --report results/hunyuan_i2v_last_first100_robustness.json \
            --report results/hunyuan_i2v_last_primary100_178.json --manifest configs/primary_manifest.json \
            --oracle-dir results --count "${#receipts[@]}" > ci-temporal-diagnostics/table12-oracle.md
          python tools/pool_clean_consistency.py results/hunyuan_i2v_clean_consistency_paper{003,032,033,043,063,071,098,112,146,149,160,174}.json \
            > ci-temporal-diagnostics/table13-clean-consistency.json
          python tools/stress_recovery_table.py --reports results/stress_paper*_forty_maps.json \
            --primary results/hunyuan_i2v_last_first100_robustness.json --alignment > ci-temporal-diagnostics/table15.json
          python tools/stress_recovery_table.py --reports results/stress_paper*_forty_maps.json \
            --format markdown > ci-temporal-diagnostics/table15-recovery.md
          python tools/stress_deletion_alignment.py --reports results/stress_paper*_forty_maps.json \
            > ci-temporal-diagnostics/table15-deletion.json
      - uses: actions/upload-artifact@v4
        with:
          name: audited-partial-temporal-diagnostics
          path: ci-temporal-diagnostics/
          if-no-files-found: error
  video-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[video,test]'
      - run: pip check
      - run: pytest -q
  native-baseline-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[video,baselines]'
      - run: pip check
      - run: python -m last.upstream --directory .ci-upstream --download
      - name: Native initial-noise interfaces (not video robustness)
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          for method in videoshield videomark sigmark; do
            python -m last.baseline_probe --method "$method" --upstream .ci-upstream --output "ci-native-probes/$method"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          for method in ('videoshield', 'videomark', 'sigmark'):
              result = json.loads((Path('ci-native-probes') / method / 'receipt.json').read_text())
              assert result['status'] == 'completed' and result['correct_bits'] == 512, result
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-interface-receipts
          path: ci-native-probes/*/receipt.json
          if-no-files-found: error
