[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "last-watermark"
version = "0.1.0"
description = "Reproducible endpoint latent-frequency video watermarking"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4", "torch==2.5.1", "scipy==1.14.1", "bchlib==2.1.3"]

[project.optional-dependencies]
figures = ["matplotlib==3.8.0"]
test = ["pytest==8.3.5"]
baselines = ["galois==0.4.4", "ldpc==2.2.8", "Levenshtein==0.27.1", "pycryptodome==3.23.0", "numba==0.61.2", "llvmlite==0.44.0"]
video = ["timm==1.0.15", "torchvision==0.20.1", "diffusers==0.35.2", "transformers==4.51.0", "accelerate==1.2.1", "huggingface-hub==0.34.4", "peft==0.17.1", "opencv-python-headless==4.10.0.84", "Pillow==11.0.0", "sentencepiece==0.2.0", "imageio==2.37.0", "imageio-ffmpeg==0.6.0", "ftfy==6.3.1", "wcwidth==0.2.13"]

[project.scripts]
last = "last.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

